trace_rag:
  selector: trace_full
  selector_algorithm: lazy_greedy
  token_budget: 8000
  max_chunks_per_paper: 2
  max_publication_versions_per_family: 1
  minimum_marginal_gain: 0.002

  minimum_selected_papers: 6
  minimum_independent_lineages_for_good: 3
  facet_coverage_threshold: 0.60
  flow_lineage_capacity: 1.0
  flow_anchor_papers: 3

  flow_minimum_papers: 14

  flow_reserve_relevance_fraction: 0.80



  robust_exact_partition_max_components: 9



  robust_certification_max_papers: 9
  robust_exact_partition_max_search_states: 100000

  robust_lineage_review_simulation_budget: 8
  candidate_limit: 100
  max_candidate_papers: 40
  utility:
    alpha_facet_coverage: 0.30
    beta_scale_triangulation: 0.20
    gamma_independent_evidence: 0.25
    delta_polarity_coverage: 0.10
    eta_relevance_quality: 0.15
  evaluation:
    bootstrap_iterations: 2000
    random_seed: 42
    confidence_level: 0.95
  status: developmental
  warning: Do not tune these weights on held-out test questions.
