  - query_id: sex_diff_molecular_immunity
    collection: malaria
    category: sex_diff
    query: '"sex-specific" malaria immunity OR "sex differences" "Plasmodium falciparum" immunity OR "sexual dimorphism" malaria immunity'
  - query_id: malaria_bioinformatics_tools
    collection: malaria
