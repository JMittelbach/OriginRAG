    category: parasite_biology
    query: '"Plasmodium falciparum" epigenetic OR "Plasmodium falciparum" chromatin OR "Plasmodium falciparum" histone'
  - query_id: malaria_single_cell_omics
    collection: malaria
    category: malaria_omics
    query: 'malaria "single-cell" OR malaria scRNA OR "Plasmodium falciparum" "single cell"'
  - query_id: host_parasite_transcriptomics
    collection: malaria
    category: malaria_omics
    query: '"host-parasite transcriptomics" malaria OR "dual RNA-seq" malaria OR malaria transcriptomics'
  - query_id: molecular_resistance_markers
