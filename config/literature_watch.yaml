    query: 'malaria bioinformatics OR "Plasmodium falciparum" pipeline OR "var gene" pipeline OR "malaria cell atlas"'
  - query_id: scrna_annotation_methods
    collection: scrna_annotation
    category: scrna_annotation
    query: '"single-cell annotation" OR "cell type annotation" "single-cell" OR scRNA-seq annotation'
  - query_id: scrna_reference_mapping
    collection: scrna_annotation
    category: scrna_annotation
    query: '"single-cell reference mapping" OR "cell atlas annotation" OR "reference mapping" scRNA'
  - query_id: scrna_foundation_models
    collection: scrna_annotation
    category: scrna_annotation
