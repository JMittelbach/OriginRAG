queries:
  - query_id: var_pfemp1_core
    category: var_pfemp1
    query: 'PfEMP1 OR "var gene" OR "var genes" OR "variant surface antigen"'
  - query_id: var_gene_expression
    category: var_pfemp1
    query: '"var gene expression" OR "virulence gene expression" OR "variant surface antigen expression"'
  - query_id: var_antigenic_variation
    category: var_pfemp1
    query: '"antigenic variation" "Plasmodium falciparum" OR "allelic exclusion" "Plasmodium falciparum"'
  - query_id: pfemp1_domains_binding
    category: var_pfemp1
    query: 'PfEMP1 domain OR CIDR OR DBLalpha OR "DBL alpha" OR EPCR OR CD36 OR ICAM1'
  - query_id: cytoadherence_sequestration
    category: var_pfemp1
    query: 'cytoadherence malaria OR sequestration malaria OR rosetting malaria OR "infected erythrocyte adhesion"'
  - query_id: var2csa_molecular
    category: var_pfemp1
    query: 'VAR2CSA OR "chondroitin sulfate A" "Plasmodium falciparum" OR "CSA-adhering" "Plasmodium falciparum"'
  - query_id: severe_malaria_pathogenesis_molecular
    category: var_pfemp1
    query: '"severe malaria" PfEMP1 OR "cerebral malaria" sequestration OR "parasite biomass" "severe malaria"'
  - query_id: parasite_population_genomics
    category: parasite_biology
    query: '"Plasmodium falciparum" "population genomics" OR "Plasmodium falciparum" "population genetics"'
  - query_id: parasite_evolution_recombination
    category: parasite_biology
    query: '"Plasmodium falciparum" evolution OR "Plasmodium falciparum" recombination OR "var gene" evolution'
  - query_id: parasite_genome_transcriptome
    category: parasite_biology
    query: '"Plasmodium falciparum" genome OR "Plasmodium falciparum" transcriptome OR "parasite transcriptomics"'
