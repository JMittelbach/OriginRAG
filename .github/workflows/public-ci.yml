name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-launcher:
    name: Windows launcher
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_windows_cmd.py

  browser:
    name: Browser workflows and connection recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install browser test environment
        run: |
          python -m pip install -e '.[dev]' playwright
          python -m playwright install --with-deps chromium firefox
      - name: Exercise user workflows and recovery
        run: |
          python -m pytest -q \
            tests/test_web_models.py \
            tests/test_model_catalog_browser.py \
            tests/test_model_panel_browser.py \
            tests/test_navigation_accounts.py \
            tests/test_dialog_close_browser.py \
            tests/test_web_onboarding_browser.py \
            tests/test_workspace_recovery_browser.py \
            tests/test_workspace_small_polish_browser.py \
            tests/test_ecosystem_design_browser.py \
            tests/test_web_reader.py \
            tests/test_reader_product_browser.py \
            tests/test_reader_tools_browser.py \
            tests/test_reader_navigation_browser.py \
            tests/test_reader_notebook_browser.py \
            tests/test_reading_history_browser.py \
            tests/test_reading_history_recovery_browser.py \
            tests/test_reader_reading_status_browser.py \
            tests/test_workspace_profiles_browser.py \
            tests/test_workspace_navigation.py \
            tests/test_document_sync.py \
            tests/test_folio_http.py \
            tests/test_folio_format_pane.py \
            tests/test_folio_engine.py \
            tests/test_folio_browser.py \
            tests/test_folio_schema_edges.py \
            tests/test_folio_ui_edges.py \
            tests/test_folio_save_file_browser.py \
            tests/test_folio_layout_edges.py \
            tests/test_folio_notes.py \
            tests/test_folio_notes_engine.py \
            tests/test_folio_drawing_browser.py \
            tests/test_folio_word_ribbon_browser.py \
            tests/test_folio_document_tools_browser.py \
            tests/test_folio_editing_polish_browser.py \
            tests/test_writing.py \
            tests/test_writing_editor_integration.py::test_outline_exact_line_nested_titles_and_literal_examples \
            tests/test_quill_citations_backups.py \
            tests/test_writing_chat_browser.py \
            tests/test_quill_compile_fixes.py \
            tests/test_writing_chat_threads_browser.py \
            tests/test_writing_chat_reset_browser.py \
            tests/test_writing_chat_window_browser.py \
            tests/test_writing_inline_review_browser.py \
            tests/test_writing_language_browser.py \
            tests/test_writing_collaboration_browser.py \
            tests/test_writing_references_browser.py
      - name: Verify Folio in Firefox
        env:
          ORIGINRAG_TEST_BROWSER: firefox
        run: >-
          python -m pytest -q tests/test_folio_browser.py tests/test_folio_ui_edges.py
          tests/test_folio_save_file_browser.py tests/test_folio_notes_engine.py
          tests/test_folio_drawing_browser.py tests/test_folio_word_ribbon_browser.py
          tests/test_folio_document_tools_browser.py
          tests/test_folio_editing_polish_browser.py
          tests/test_folio_format_pane.py
          tests/test_web_models.py

  python:
    name: Python 3.11, tests, CLI, and distributions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
          .venv/bin/python -m pip install build

      - name: Lint
        run: .venv/bin/python -m ruff check .

      - name: Check for tracked local data
        run: .venv/bin/python scripts/check_private_files.py

      - name: Initialise empty local catalogue
        run: .venv/bin/python scripts/init_local_data.py

      - name: Run test suite
        run: .venv/bin/python -m pytest -q

      - name: Exercise public source-checkout commands
        run: |
          ./originrag help
          ./originrag --version
          .venv/bin/python scripts/check_environment.py
          ./originrag search-papers "severe malaria EPCR" --limit 3 \
            --out "$RUNNER_TEMP/metadata-search.tsv"
          test "$(wc -l < "$RUNNER_TEMP/metadata-search.tsv")" -eq 1

      - name: Build wheel and source distribution
        run: |
          .venv/bin/python -m build
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              wheel_names = archive.namelist()
          with tarfile.open(sdist, "r:gz") as archive:
              sdist_names = archive.getnames()
          assert wheel.name.startswith("originrag-")
          assert any(name.endswith("originrag/db/schema.sql") for name in wheel_names)
          forbidden = (
              "assets/catalogue/", "data/chunks/", "data/indexes/", "bib/papers/", "outputs/",
              "originrag/evaluation/", "originrag/trace/lineage_trap_v1.py",
              "docs/manuscript/", "pfempire/",
          )
          assert not any(any(part in name for part in forbidden) for name in wheel_names)
          assert not any(any(part in name for part in forbidden) for name in sdist_names)
          PY

      - name: Smoke-test the built wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/originrag-wheel"
          "$RUNNER_TEMP/originrag-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/originrag-wheel/bin/python" - "$RUNNER_TEMP/test.sqlite" <<'PY'
          from pathlib import Path
          import sys
          import importlib.util

          import originrag
          from originrag.db.database import initialize_database

          assert originrag.__version__ == "0.1.0"
          assert importlib.util.find_spec("pfempire") is None
          assert initialize_database(Path(sys.argv[1]))
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: originrag-python-distributions
          path: |
            dist/*
