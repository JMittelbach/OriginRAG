name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.11, tests, CLI, and distributions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
          .venv/bin/python -m pip install build

      - name: Lint
        run: .venv/bin/python -m ruff check .

      - name: Check for tracked local data
        run: .venv/bin/python scripts/check_private_files.py

      - name: Initialise local example catalogue
        run: .venv/bin/python scripts/init_local_data.py

      - name: Run test suite
        run: .venv/bin/python -m pytest -q

      - name: Exercise public source-checkout commands
        run: |
          ./originrag help
          ./originrag --version
          .venv/bin/python scripts/check_environment.py
          ./originrag search-papers "severe malaria EPCR" --limit 3 \
            --out "$RUNNER_TEMP/metadata-search.tsv"
          test "$(wc -l < "$RUNNER_TEMP/metadata-search.tsv")" -gt 1

      - name: Build wheel and source distribution
        run: |
          .venv/bin/python -m build
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              wheel_names = archive.namelist()
          with tarfile.open(sdist, "r:gz") as archive:
              sdist_names = archive.getnames()
          assert wheel.name.startswith("originrag-")
          assert any(name.endswith("originrag/db/schema.sql") for name in wheel_names)
          forbidden = (
              "data/chunks/", "data/indexes/", "bib/papers/", "outputs/",
              "originrag/evaluation/", "originrag/trace/lineage_trap_v1.py",
              "docs/manuscript/", "pfempire/",
          )
          assert not any(any(part in name for part in forbidden) for name in wheel_names)
          assert not any(any(part in name for part in forbidden) for name in sdist_names)
          PY

      - name: Smoke-test the built wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/originrag-wheel"
          "$RUNNER_TEMP/originrag-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/originrag-wheel/bin/python" - "$RUNNER_TEMP/test.sqlite" <<'PY'
          from pathlib import Path
          import sys
          import importlib.util

          import originrag
          from originrag.db.database import initialize_database

          assert originrag.__version__ == "0.1.0"
          assert importlib.util.find_spec("pfempire") is None
          assert initialize_database(Path(sys.argv[1]))
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: originrag-python-distributions
          path: |
            dist/*
