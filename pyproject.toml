[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "originrag"
version = "0.1.0"
description = "Local-first scientific RAG with origin-aware evidence-sufficiency certification."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Jannes Mittelbach"},
]
keywords = [
    "evidence synthesis",
    "retrieval-augmented generation",
    "scientific provenance",
    "study overlap",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "python-dotenv",
    "pymupdf",
]

[project.urls]
Homepage = "https://github.com/JMittelbach/OriginRAG"
Documentation = "https://github.com/JMittelbach/OriginRAG#readme"
Repository = "https://github.com/JMittelbach/OriginRAG.git"
Issues = "https://github.com/JMittelbach/OriginRAG/issues"

[project.optional-dependencies]
write = []
rag = [
    "pandas",
    "pydantic>=2,<3",
    "pyyaml",
    "typer",
    "rich",
    "prompt-toolkit>=3.0.48,<4",
    "rapidfuzz",
]
full = [
    "pandas",
    "pydantic>=2,<3",
    "pyyaml",
    "typer",
    "rich",
    "prompt-toolkit>=3.0.48,<4",
    "rapidfuzz",
]
dev = [
    "pandas",
    "pydantic>=2,<3",
    "pyyaml",
    "typer",
    "rich",
    "prompt-toolkit>=3.0.48,<4",
    "rapidfuzz",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"originrag.db" = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]



select = ["E4", "E7", "E9", "F"]
